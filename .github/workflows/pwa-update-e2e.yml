name: pwa-e2e

on:
  pull_request:
    paths:
      - "src/lib/pwa/**"
      - "src/components/site/PwaController.tsx"
      - "public/offline.html"
      - "vite.config.ts"
      - "scripts/pwa-update-e2e.py"
      - "scripts/pwa-offline-e2e.py"
      - "scripts/pwa-fixture/**"
      - "scripts/pwa-offline-fixture/**"
      - ".github/workflows/pwa-update-e2e.yml"
  workflow_dispatch:

concurrency:
  group: pwa-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Sync workbox-window into fixtures
        # Both fixtures serve the same module list from node_modules.
        run: |
          cp node_modules/workbox-window/build/*.mjs scripts/pwa-fixture/
          cp node_modules/workbox-window/build/*.mjs scripts/pwa-offline-fixture/

      - name: Run PWA Reload E2E
        run: python scripts/pwa-update-e2e.py

      - name: Run PWA Offline E2E
        run: python scripts/pwa-offline-e2e.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-e2e
          path: qa-report/
          if-no-files-found: ignore
