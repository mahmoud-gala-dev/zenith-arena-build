<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PWA fixture</title></head><body>
<h1>PWA fixture</h1><div id="status">idle</div>
<button id="reload-btn" disabled>Reload</button>
<script type="module">
import { Workbox } from "/workbox-window.prod.mjs";
const status = document.getElementById("status");
const btn = document.getElementById("reload-btn");
const wb = new Workbox("/sw.js", { scope: "/" });
const updateAndReload = async () => {
  console.log("[fix] updateAndReload start");
  await new Promise((resolve) => {
    wb.addEventListener("controlling", () => { console.log("[fix] controlling event"); resolve(); });
    console.log("[fix] messageSkipWaiting");
    wb.messageSkipWaiting();
  });
  console.log("[fix] calling reload");
  window.location.reload();
};
wb.addEventListener("waiting", (e) => {
  console.log("[fix] waiting event, isUpdate=", e.isUpdate, "wasWaitingBeforeRegister=", e.wasWaitingBeforeRegister);
  status.textContent = "waiting";
  btn.disabled = false;
});
wb.addEventListener("installed", (e) => console.log("[fix] installed, isUpdate=", e.isUpdate));
wb.addEventListener("activated", (e) => console.log("[fix] activated, isUpdate=", e.isUpdate));
wb.addEventListener("redundant", () => console.log("[fix] redundant"));
btn.addEventListener("click", () => { console.log("[fix] click"); void updateAndReload(); });
wb.register().then(r => { console.log("[fix] registered", r?.scope); status.textContent="registered"; })
             .catch(e => { console.log("[fix] register failed", e.message); status.textContent="fail"; });
</script></body></html>
