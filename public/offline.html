<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f19" />
  <title>Offline — Egytic Sports</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    html,body { margin:0; height:100%; background:#0b0f19; color:#e8fff6;
      font-family: system-ui, -apple-system, "Segoe UI", "Cairo", sans-serif; }
    main { min-height:100%; display:grid; place-items:center; padding:24px; text-align:center; }
    .card { max-width:420px; }
    .logo { width:88px; height:88px; margin:0 auto 20px; display:block; }
    h1 { font-size:28px; margin:0 0 8px; font-weight:800; letter-spacing:-.02em; }
    p  { font-size:15px; margin:0 0 24px; color:#a7c8bb; line-height:1.6; }
    button { appearance:none; border:0; padding:12px 22px; border-radius:12px;
      background:linear-gradient(135deg,#12b981,#0a7d5a); color:#fff; font-weight:700;
      font-size:15px; cursor:pointer; }
    button:active { transform: scale(.98); }
    small { display:block; margin-top:18px; color:#5f7a71; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="logo" src="/icon.svg" alt="Egytic" />
      <h1>You're offline</h1>
      <p>لا يوجد اتصال بالإنترنت الآن. تم عرض هذه الصفحة من الذاكرة المؤقتة.<br/>
         No connection right now — the app served this page from cache.</p>
      <button onclick="location.reload()">Try again</button>
      <small>Egytic Sports · PWA</small>
    </div>
  </main>
</body>
</html>
